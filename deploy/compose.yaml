# Production stack for https://fit.triple-a.dev — lives at /opt/training-app/compose.yaml.
# deploy/deploy.sh uploads the repository to ./src and copies this file and the Caddyfile next to it.
#
#   /opt/training-app/
#     compose.yaml  Caddyfile  .env (optional)  src/ (build context)  data/ (SQLite + backups, uid 1000)
#
# The project name and the caddy_data / caddy_config volume keys must not change:
# the TLS certificate and ACME account live in caddy_data.
name: training-app

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    build:
      context: ./src
    image: training-app:latest
    restart: unless-stopped
    init: true
    # Optional overrides (VAPID_*, LOG_LEVEL, …); the password lives in the database, not here.
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_ORIGIN: https://fit.triple-a.dev
    volumes:
      - ./data:/data
    # Not published: only Caddy is reachable from outside (published ports bypass ufw).
    expose:
      - '3000'
    # Caddy reaches the app by this unique alias (see Caddyfile): the plain service name `app` is ambiguous
    # for Caddy, which is also on the shared `edge` network with other projects.
    networks:
      default:
        aliases:
          - legko-app
    read_only: true
    tmpfs:
      - /tmp
    # The host has 2 GB: if the app ever runs away with memory, the kernel kills and Docker restarts
    # it (restart: unless-stopped) instead of the whole box going into swap. Node sizes its heap
    # from this limit (≈ 260 MB), enough for a 16 MB import.
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Healthcheck comes from the image (GET /api/health).
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Site files of other projects on this VPS (see the end of the Caddyfile).
      - /opt/caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    # `edge` is shared with other projects' stacks so Caddy can reach their containers by name;
    # the app itself stays on the private default network.
    networks:
      - default
      - edge
    logging: *logging

networks:
  edge:
    external: true
    name: edge

volumes:
  caddy_data:
  caddy_config:
